name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t quotad .
      - name: smoke test
        run: |
          docker run -d --name quotad-ci -p 8080:8080 quotad
          for i in $(seq 1 20); do curl -fsS localhost:8080/__quotad/health && exit 0; sleep 1; done
          docker logs quotad-ci; exit 1
